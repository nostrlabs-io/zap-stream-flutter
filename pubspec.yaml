name: zap_stream_flutter
description: "zap.stream"
publish_to: "none"
version: 1.1.5+19

environment:
  # raised by the dependency bump: flutter_local_notifications 22 and friends
  # require Dart ^3.10.0, which ships with Flutter 3.38+
  sdk: ^3.10.0
  flutter: ^3.41.6

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  ndk: ^0.3.2
  ndk_objectbox: ^0.2.3
  ndk_amber: ^0.3.0
  amberflutter: ^0.0.9
  ndk_rust_verifier: ^0.3.1
  go_router: ^17.3.0
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.1.0
  wakelock_plus: ^1.3.2
  rxdart: ^0.28.0
  crypto: ^3.0.6
  convert: ^3.1.2
  collection: ^1.19.1
  clipboard: ^3.0.14
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  video_player: ^2.9.5
  chewie: ^1.11.3
  image_picker: ^1.1.2
  emoji_picker_flutter: ^4.3.0
  bech32: ^0.2.2
  flutter_markdown_plus: ^1.0.3
  share_plus: ^12.0.2
  duration: ^4.0.3
  slang: ^4.7.1
  slang_flutter: ^4.7.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  http: ^1.4.0
  flutter_local_notifications: ^22.2.0
  flutter_dotenv: ^6.0.1
  protocol_handler: ^0.2.0
  audio_service: ^0.18.18
  apivideo_live_stream: ^1.2.0

dependency_overrides:
  ndk:
    git:
      url: https://github.com/relaystr/ndk
      path: packages/ndk
      ref: 00eee5460ca478a02ec9a91c0a6100f2e50eddce
  ndk_objectbox:
    git:
      url: https://github.com/relaystr/ndk
      path: packages/objectbox
      ref: 00eee5460ca478a02ec9a91c0a6100f2e50eddce
  ndk_amber:
    git:
      url: https://github.com/relaystr/ndk
      path: packages/amber
      ref: 00eee5460ca478a02ec9a91c0a6100f2e50eddce
  ndk_rust_verifier:
    git:
      url: https://github.com/relaystr/ndk
      path: packages/rust_verifier
      ref: 00eee5460ca478a02ec9a91c0a6100f2e50eddce
  emoji_picker_flutter:
    git:
      url: https://github.com/nostrlabs-io/emoji_picker_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - ".env"
    - ".env.development"
    - "assets/svg/"
    - "assets/logo.png"
    - "assets/category/"

flutter_launcher_icons:
  ios: true
  image_path: assets/logo.jpg